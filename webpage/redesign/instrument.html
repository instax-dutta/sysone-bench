<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0;background:#dfe4e2;color:#14201f;font:14px/1.5 Arial,sans-serif;padding:36px}
.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#0f6b60}
h1{font:700 48px/.98 'Arial Narrow',Arial,sans-serif;letter-spacing:-.02em;margin:18px 0 22px;max-width:680px}
.panel{background:#f5f7f5;border:1px solid #9aa8a4;padding:22px;box-shadow:inset 0 0 0 4px #e3e8e6}
.read{display:flex;align-items:flex-end;gap:18px}.big{font:600 92px/1 ui-monospace,monospace;letter-spacing:-.07em;color:#0f6b60}
.scale{height:26px;border-bottom:2px solid #14201f;background:repeating-linear-gradient(90deg,#14201f 0 1px,transparent 1px 22px);position:relative}
.dot{width:10px;height:10px;border-radius:50%;background:#e2603f;position:absolute;bottom:-6px;left:72%}
.row{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;border-bottom:1px solid #b9c3bf;padding:9px 0;font:12px ui-monospace,monospace}
.bar{height:9px;background:#0f6b60}
</style></head><body><p class=eyebrow>sysone-bench · measurement instrument</p><h1>One input. Fifty readings.</h1>
<div class=panel><div class=read><div class=big>0.8702</div><div class=scale><span class=dot></span><div style="font:10px ui-monospace,monospace;margin-top:8px">seb-9b / closed reference 0.9065</div></div></div>
<div style="margin-top:18px"><div class=row><b>seb-9b</b><span>0.8702</span><span class=bar style="width:88%"></span></div>
<div class=row><b>decider-4b</b><span>0.8581</span><span class=bar style="width:82%"></span></div></div></div>
</body></html>
